[package]
name = "parakeet-candle"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
accelerate-src = { version = "0.3.2", optional = true }
audioadapter-buffers = "5.2.0"
candle = { package = "candle-core", version = "0.11.1", default-features = false }
candle-nn = { version = "0.11.1", default-features = false }
clap = { version = "4.6.9", features = ["derive"] }
hf-hub = { version = "1.0.0", features = ["blocking"] }
intel-mkl-src = { version = "0.8.1", optional = true }
rubato = "5.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["mp3", "aac"] }

[features]
default = []
accelerate = [
  "dep:accelerate-src",
  "candle/accelerate",
  "candle-nn/accelerate",
]
cuda = [
  "candle/cuda",
  "candle-nn/cuda",
]
cudnn = [
  "candle/cudnn",
  "candle-nn/cudnn",
]
metal = [
  "candle/metal",
  "candle-nn/metal",
]
mkl = [
  "dep:intel-mkl-src",
  "candle/mkl",
  "candle-nn/mkl",
]
